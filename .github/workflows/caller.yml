name: Manage Key Vault Secrets

# Single caller workflow for both directions. Triggers the reusable
# workflow, which picks one of its two jobs (extract or upsert) based on
# the "operation" input below.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "extract = pull values out of the vault into the file. upsert = push name/value pairs from the file into the vault (create if missing, update if present)."
        required: true
        type: choice
        options:
          - extract
          - upsert
        default: extract
      keyvault-name:
        description: "Azure Key Vault name"
        required: true
        type: string
      secrets-file:
        description: "Path to the JSON secrets file"
        required: false
        type: string
        default: "config/secrets-list.json"

jobs:
  manage-secrets:
    permissions:
      contents: read
      id-token: write # required so the reusable workflow can request an OIDC token for Azure login
    uses: ./.github/workflows/reusable-keyvault-secrets.yml
    with:
      operation: ${{ inputs.operation }}
      keyvault-name: ${{ inputs.keyvault-name }}
      secrets-file: ${{ inputs.secrets-file }}
      artifact-name: "extracted-secrets"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}