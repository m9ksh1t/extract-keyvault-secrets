name: Manage Key Vault Secrets
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "extract = pull values out of the vault into the file. upsert = push name/value pairs from the file into the vault (create if missing, update if present)."
        required: true
        type: choice
        options:
          - extract
          - upsert
        default: extract
      keyvault-name:
        description: "Azure Key Vault name"
        required: true
        type: string
      secrets-file-path:
        description: "Path to the JSON secrets file"
        required: true
        type: string

jobs:
  manage-secrets:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-keyvault-secrets.yml
    with:
      operation: ${{ inputs.operation }}
      keyvault-name: ${{ inputs.keyvault-name }}
      secrets-file-path: ${{ inputs.secrets-file-path }}
      artifact-name: "extracted-secrets"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}